api_version: 3
version: 3.2.0
platforms: [windows]
module: skills.set_route_ai.main
name: SetRouteAI
display_name: SetRouteAI
author: Thord - galacticgearjammer - ProjectGnome, Dominicus
tags: [Star Citizen, Navigation, Utility]
description:
  en: Calibrated, foreground-guarded Star Citizen navigation with optional route vision.
hint:
  en: Calibrate first. Start routing with the Starmap closed and Star Citizen focused.
discoverable_by_default: false
discovery_keywords: [plot route, set course, navigation, calibrate starmap, cancel route, my mission, alias]
examples:
  - en: Plot a route to Daymar.
  - en: Set course for cruel one.
  - en: Take me to my mission.
prompt: |
  These instructions apply only to explicit Star Citizen navigation, calibration
  and destination-management requests. Other conversation is unaffected.
  For each requested route call plot_route, passing the player's destination words
  unchanged, including uncertain names such as "cruel one" or "aerial". Never use
  your own knowledge to invent, correct or add a destination. The tool validates
  against its database, resolves known aliases and asks for ambiguous choices.
  For "take me to my mission", pass "my mission"; the tool checks current game-log
  evidence and may be unable to resolve a location.
  Destinations supplied by other active skills, such as UEXCorp terminals or trade
  routes, are welcome but must still go through plot_route validation.
  Ask the player to choose when the tool returns alternatives, at most three.
  Use cancel_route when asked to stop routing or calibration.
  Use calibrate_mouse when explicitly asked to calibrate navigation.
  Add/delete/rename destinations or aliases only when explicitly requested.
  Use list_aliases for alias questions. Never claim a route succeeded unless the
  tool says verified; macro sent is not verification. Repeat failure honestly.
  Calibration has fixed audio instructions in English, Spanish, German, Chinese
  and Japanese. Other language understanding depends on the configured wingman;
  database matching is name/alias based, not a multilingual translation service.
custom_properties:
  - id: language
    name: Calibration language
    property_type: single_select
    value: en
    options:
      - {label: English, value: en}
      - {label: Spanish, value: es}
      - {label: German, value: de}
      - {label: Chinese, value: zh}
      - {label: Japanese, value: ja}
  - {id: route_display, name: Game display, property_type: number, value: 1, hint: "1–32. Select the game monitor and recalibrate after changes."}
  - {id: key_hold, name: Key hold seconds, property_type: number, value: 0.15, hint: "0.05–2 seconds"}
  - {id: map_delay, name: Starmap opening delay, property_type: number, value: 3.5, hint: "1–15 seconds"}
  - {id: step_delay, name: Mouse step delay, property_type: number, value: 1.3, hint: "0.2–5 seconds"}
  - {id: search_delay, name: Search result delay, property_type: number, value: 1.5, hint: "0.5–10 seconds"}
  - {id: plan_delay, name: Route planning delay, property_type: number, value: 3.0, hint: "0.5–15 seconds"}
  - {id: zoom_steps, name: Zoom-out wheel steps, property_type: number, value: 60, hint: "0–100 whole steps"}
  - {id: allow_ai_disambiguation, name: Allow AI candidate choice, property_type: boolean, value: false, hint: "Optional provider call; otherwise ambiguous names ask you."}
  - {id: verify_route_with_vision, name: Verify route with vision, property_type: boolean, value: false, hint: "Sends an in-memory Starmap screenshot to your configured AI provider."}
  - {id: vision_display, name: Vision display, property_type: number, value: 1, hint: "1–32. Select the monitor showing the Starmap."}
  - {id: show_verification_screenshot, name: Show verification image in client log, property_type: boolean, value: false, hint: "Also exposes the screenshot in the client log."}
